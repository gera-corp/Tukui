name: Release pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build package and publish a GitHub release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Workaround checkout issues
        run: |
          git fetch --tags --force
      # Fork: the original pipeline uploaded to the tukui.org CDN with the author's key.
      # Here the packager builds the zip and attaches it to a GitHub release instead.
      - name: Create package and GitHub release
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tukui-${{ github.ref_name }}
          path: .release/*.zip
