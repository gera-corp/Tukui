name: Development pipeline

on:
  push:
    branches:
      - "*"
      - "!feature/"

jobs:
  build:
    name: Build development package
    runs-on: ubuntu-22.04
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Workaround checkout issues
        run: |
          git fetch --tags --force
      # Fork: build only (no tukui.org CDN upload), the zip is attached to the run.
      - name: Create Package
        uses: BigWigsMods/packager@v2
        with:
          args: -d -n "{package-name}-$GITHUB_REF_NAME-{project-version}"
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tukui-${{ github.ref_name }}-${{ github.sha }}
          path: .release/*.zip
